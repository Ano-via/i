name: Generate Huangli Calc

on:
  schedule:
    # 每天北京时间 01:15
    - cron: "15 17 * * *"

  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "huangli-calc.py"
      - "huangli-calc-requirements.txt"
      - ".github/workflows/huangli-generate.yml"

permissions:
  contents: write

concurrency:
  group: generate-huangli-calc
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: huangli-calc-requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r huangli-calc-requirements.txt

      - name: Generate yi.calc and ji.calc
        run: python main.py

      - name: Commit generated files
        run: |
          git add data/yi.calc data/ji.calc

          if git diff --cached --quiet; then
            echo "数据没有变化，无需提交。"
          else
            git config user.name "github-actions[bot]"
            git config user.email \
              "41898282+github-actions[bot]@users.noreply.github.com"

            git commit -m "Update Huangli calc data"
            git push origin HEAD:main
          fi
